# Full test suite — TypeScript crypto core plus the Rust implementation —
# on every push to main and every pull request.
#
# The Rust job matters most here: a Dependabot bump to argon2, chacha20poly1305
# or zeroize that broke TS<->Rust parity would otherwise only be caught by
# hand. The parity tests in crypto.rs decrypt blobs produced by @seqrets/crypto,
# so they fail loudly if the two implementations drift apart.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto-ts:
    name: Crypto core (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  crypto-rust:
    name: Crypto core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo test --lib` still compiles the whole app crate, which links
      # Tauri (webkit/gtk), the PC/SC smart card library and the keyring's
      # D-Bus backend. These are Tauri's documented Linux build dependencies
      # plus pcsclite and dbus.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libpcsclite-dev libdbus-1-dev

      - name: Run tests
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib
