name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gate the deploy on the crypto suite. app.seqrets.app is the live web app —
  # a regression in createShares/parseShare must not reach it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crypto core tests
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build crypto package
        run: npm run build:crypto

      - name: Generate version module
        run: npm run generate:version

      - name: Sync web assets (mp3 audio from desktop assets dir)
        run: npm run sync:web-assets

      - name: Build Next.js static export
        run: npx next build

      # Direct upload of the prebuilt static export — Cloudflare never builds
      # Next.js itself (that is what broke the March 2026 attempt). Security
      # headers ship inside out/ via public/_headers. Wrangler is pinned so a
      # new release can't change deploy behavior unannounced.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.142.0 pages deploy out --project-name seqrets-app --branch main --commit-hash ${{ github.sha }}
