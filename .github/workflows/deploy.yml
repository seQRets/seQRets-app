name: Deploy holding page

# app.seqrets.app serves only the static holding page in holding/ (the web app
# was retired 2026-10-06). Redeploy only when that page or this workflow
# changes; tests run separately in tests.yml.
on:
  push:
    branches: [main]
    paths:
      - 'holding/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22: wrangler 4.x refuses to run on anything older.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Direct upload of holding/ as-is (no build step). Its security headers
      # ship in holding/_headers. Wrangler is pinned so a new release can't
      # change deploy behavior unannounced.
      - name: Deploy holding page to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.142.0 pages deploy holding --project-name seqrets-app --branch main --commit-hash ${{ github.sha }}
