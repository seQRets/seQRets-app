name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Crypto suite on every push to main. Until CI is reworked (web-removal
  # step D) this is the only place pushes to main get tested.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crypto core tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22: wrangler 4.x refuses to run on anything older.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The web app is retired: app.seqrets.app serves only the static holding
      # page in holding/ (no build step). Its security headers ship in
      # holding/_headers. Wrangler is pinned so a new release can't change
      # deploy behavior unannounced.
      - name: Deploy holding page to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.142.0 pages deploy holding --project-name seqrets-app --branch main --commit-hash ${{ github.sha }}
